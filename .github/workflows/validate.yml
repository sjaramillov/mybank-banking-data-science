name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test private-file publication boundary
        run: python -m unittest discover -s scripts -p 'test_publication_policy.py'
      - name: Check publication contents and provenance
        run: python scripts/check_repository.py
      - run: python -m pip install uv==0.11.17
      - run: uv sync --locked
      - name: Run tests and development demonstrations (holdouts closed)
        run: uv run python scripts/verify.py
