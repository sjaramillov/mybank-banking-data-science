name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check publication contents and provenance
        run: python scripts/check_repository.py
      - run: python -m pip install uv==0.11.17
      - run: uv sync --locked
      - name: Run tests and development demonstrations (holdouts closed)
        run: uv run python scripts/verify.py
